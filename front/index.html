<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Exam — Éléments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="page">
        <nav class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                CMS Exam
            </div>
            <div id="api-status" class="status-pill" role="status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="api-status-text">Connexion…</span>
            </div>
        </nav>

        <header class="hero">
            <p class="eyebrow">Mohamed Iraqi · Examen MERN</p>
            <h1>Mes éléments</h1>
            <p class="lead">Ajoutez un élément et retrouvez-le instantanément, enregistré dans MongoDB Atlas via une API Express.</p>
        </header>

        <main class="layout">
            <section class="panel form-panel" aria-labelledby="form-title">
                <h2 id="form-title">Nouvel élément</h2>
                <form id="item-form" novalidate>
                    <div class="field">
                        <label for="name">Nom</label>
                        <input id="name" name="name" type="text" minlength="2" maxlength="100" required placeholder="Ex : Livre" autocomplete="off">
                    </div>

                    <div class="field">
                        <div class="label-row">
                            <label for="description">Description</label>
                            <span id="char-count" class="char-count">0 / 500</span>
                        </div>
                        <textarea id="description" name="description" maxlength="500" rows="4" placeholder="Optionnel"></textarea>
                    </div>

                    <button id="submit-btn" type="submit" class="btn-primary">
                        <span class="btn-label">Ajouter l'élément</span>
                        <span class="btn-arrow" aria-hidden="true">→</span>
                    </button>
                </form>
                <p id="form-message" class="message" role="alert" aria-live="polite"></p>
            </section>

            <section class="panel list-panel" aria-labelledby="list-title">
                <div class="list-header">
                    <h2 id="list-title">Éléments</h2>
                    <span id="item-count" class="count-badge">0</span>
                </div>
                <p id="list-message" class="message" role="alert" aria-live="polite"></p>
                <ul id="item-list" class="item-list"></ul>
            </section>
        </main>

        <footer class="footer">
            Node.js · Express · MongoDB · Vercel
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
